<!DOCTYPE html>

 
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18+</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a0b2e 0%, #2d0b3f 40%, #4a0e2e 100%);
    background-attachment: fixed;
    color: #fff;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(180, 40, 200, 0.25), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(220, 40, 90, 0.25), transparent 50%);
    pointer-events: none;
  }
  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 24px;
    padding: 50px 40px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 80px rgba(180, 40, 200, 0.15);
    animation: fadeIn 0.9s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .badge {
    display: inline-block;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 8px 20px;
    border-radius: 50px;
    background: linear-gradient(90deg, #ff2d6f, #b52dd4);
    box-shadow: 0 0 25px rgba(255, 45, 111, 0.6);
    margin-bottom: 28px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 30px;
    line-height: 1.35;
    font-weight: 800;
    margin-bottom: 14px;
    text-shadow: 0 0 30px rgba(255, 45, 111, 0.4);
  }
  h1 span {
    background: linear-gradient(90deg, #ff2d6f, #d42db5, #7a2dff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.sub {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.65);
    margin-bottom: 36px;
    line-height: 1.6;
  }
  .btn {
    display: inline-block;
    text-decoration: none;
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    padding: 18px 54px;
    border-radius: 60px;
    background: linear-gradient(90deg, #ff2d6f, #b52dd4);
    box-shadow: 0 0 30px rgba(255, 45, 111, 0.55), 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .btn:hover {
    transform: scale(1.06);
    box-shadow: 0 0 50px rgba(255, 45, 111, 0.8), 0 14px 40px rgba(0, 0, 0, 0.5);
  }
  .btn:active { transform: scale(0.98); }
  .btn::after {
    content: '';
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    animation: shine 3s infinite;
  }
  @keyframes shine {
    0% { left: -80%; }
    60% { left: 130%; }
    100% { left: 130%; }
  }
  .note {
    margin-top: 26px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">18+</div>
    <h1>Барлық <span>18+ заттар</span><br>осында</h1>
    <p class="sub">Кіру үшін төмендегі батырманы басыңыз</p>
    <a class="btn" href="https://t.me/+J2TgYXbUiqMyYTBi" target="_blank" rel="noopener">Осы жерге бас</a>
    <div class="note">🔞 Тек ересектерге арналған</div>
  </div>
</body>
</html>
